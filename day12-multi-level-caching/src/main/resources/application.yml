spring:
  application:
    name: day12-multi-level-caching

  datasource:
    url: jdbc:mysql://localhost:3306/product_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 3s
      timeout: 2s

server:
  port: 8080
